# Async Screenshot Mod Metadata for Forge
# Declares the mod to the Forge mod loader. Lives at META-INF/mods.toml.

modLoader = "javafml"
loaderVersion = "[1,)"

license = "GPL-3.0"
logoFile = "assets/asyncscreenshot/icon.png"

[[mods]]
modId = "asyncscreenshot"
version = "${version}"
displayName = "Async Screenshot"
description = '''
Take screenshots without freezing — PNG encoding & disk writes move off the
render thread. Client-side, Fabric / Forge / NeoForge, MC 1.18-26.2.
'''
authors = "ReflCraft"


[[dependencies.asyncscreenshot]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.18,)"
    ordering = "NONE"
    side = "CLIENT"
